<!doctype html>
<html lang="zh-TW" data-theme="light" data-theme-mode="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f8fc">
  <meta name="description" content="Chi NAV 風格的空白網站框架。">
  <title>Chi · Blank</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="https://nav.chi.qzz.io/css/nav.css">
  <script src="https://nav.chi.qzz.io/js/theme.js" defer></script>
  <style>
    .blank-content { flex: 1; min-height: calc(100vh - 145px); }
    .blank-topbar { min-height: 100px; }
    @media (max-width: 760px) {
      .blank-content { min-height: calc(100vh - 100px); }
      .blank-topbar { min-height: 76px; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="主要導覽">
      <a class="brand" href="/" aria-label="Chi 首頁">
        <span class="brand-mark">
          <img class="brand-icon brand-icon-light" src="https://nav.chi.qzz.io/assets/icon/icon-bw.png" alt="">
          <img class="brand-icon brand-icon-dark" src="https://nav.chi.qzz.io/assets/icon/icon-wb.png" alt="">
        </span>
        <span class="brand-copy"><strong>Chi</strong><small>PERSONAL SPACE</small></span>
      </a>
      <div class="sidebar-bottom">
        <span class="sidebar-status"></span>
        <span>READY</span>
        <span class="sidebar-version">v1.0</span>
      </div>
    </aside>

    <div class="main-content">
      <header class="topbar blank-topbar">
        <div class="mobile-brand">
          <button type="button" id="mobile-menu" aria-label="開啟導覽"><i class="fa-solid fa-bars"></i></button>
          <span>Chi</span>
        </div>
      </header>
      <main id="main" class="content-wrap blank-content" aria-label="空白內容區"></main>
    </div>
  </div>
  <div class="mobile-scrim" id="mobile-scrim"></div>
  <script>
    (() => {
      const sidebar = document.getElementById('sidebar');
      const scrim = document.getElementById('mobile-scrim');
      const toggle = document.getElementById('mobile-menu');
      const close = () => {
        sidebar.classList.remove('mobile-open');
        scrim.classList.remove('visible');
      };
      toggle?.addEventListener('click', () => {
        sidebar.classList.toggle('mobile-open');
        scrim.classList.toggle('visible');
      });
      scrim?.addEventListener('click', close);
      document.addEventListener('keydown', event => {
        if (event.key === 'Escape') close();
      });
    })();
  </script>
</body>
</html>
