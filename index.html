<!doctype html>
<html lang="zh-TW" data-theme="light" data-theme-mode="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f8fc">
  <meta name="description" content="Chi 共用網站空白框架。">
  <title>Chi · Blank</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="https://nav.chi.qzz.io/css/nav.css">
  <style>
    :root { color-scheme: light dark; }
    .sidebar-toggle { display: grid; place-items: center; }
    .sidebar.collapsed { width: 76px; padding-inline: 12px; }
    .sidebar.collapsed .brand-copy,
    .sidebar.collapsed .sidebar-bottom > span:not(.sidebar-status) { display: none; }
    .sidebar.collapsed .brand { justify-content: center; padding-inline: 0; }
    .sidebar.collapsed .sidebar-toggle { right: 23px; top: 80px; }
    .main-content { min-width: 0; transition: margin-left var(--chi-transition, 180ms ease); }
    .sidebar.collapsed ~ .main-content { margin-left: 76px; }
    .blank-topbar { min-height: 82px; align-items: center; padding-top: 20px; padding-bottom: 20px; }
    .blank-content { flex: 1; min-height: calc(100vh - 82px); padding-top: 0; padding-bottom: 0; }
    .mobile-brand { display: none; align-items: center; gap: 12px; font-weight: 700; }
    .mobile-brand button {
      display: grid; place-items: center; width: 40px; height: 40px;
      border: 1px solid var(--chi-color-border, #d7dce5); border-radius: 10px;
      background: var(--chi-color-surface, #fff); color: var(--chi-color-text, #222);
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .mobile-brand button:focus-visible, .theme-toggle:focus-visible { outline: 2px solid var(--chi-color-accent, #4778df); outline-offset: 3px; }
    .theme-toggle {
      position: fixed; z-index: 45; right: 18px; bottom: 18px;
      display: grid; place-items: center; width: 44px; height: 44px;
      border: 1px solid var(--chi-color-border-strong, #c9cfda); border-radius: 12px;
      background: var(--chi-color-surface, #fff); color: var(--chi-color-text-muted, #555);
      box-shadow: var(--chi-shadow-sm, 0 3px 14px rgb(0 0 0 / 10%)); cursor: pointer;
      transition: color var(--chi-transition, 180ms ease), border-color var(--chi-transition, 180ms ease), background var(--chi-transition, 180ms ease);
      -webkit-tap-highlight-color: transparent;
    }
    .theme-toggle:hover { color: var(--chi-color-accent, #4778df); border-color: var(--chi-color-accent-border, #4778df); }
    .mobile-scrim { display: none; }
    @media (max-width: 760px) {
      html, body { min-height: 100%; }
      body { overflow-x: hidden; }
      .app-shell { display: block; min-height: 100vh; min-height: 100dvh; }
      .sidebar,
      .sidebar.collapsed {
        position: fixed; inset: 0 auto 0 0; z-index: 70;
        width: min(310px, 88vw); max-width: 100%;
        height: 100vh; height: 100dvh;
        box-sizing: border-box;
        padding: max(22px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom));
        overflow-y: auto; overscroll-behavior: contain;
        transform: translateX(-105%); visibility: hidden;
        transition: transform 220ms ease, visibility 220ms ease;
        box-shadow: 16px 0 48px rgb(0 0 0 / 16%);
      }
      .sidebar.mobile-open { transform: translateX(0); visibility: visible; }
      .sidebar.collapsed .brand-copy,
      .sidebar.collapsed .sidebar-bottom > span:not(.sidebar-status) { display: initial; }
      .sidebar.collapsed .brand { justify-content: flex-start; padding-inline: 9px; }
      .sidebar-toggle { display: none !important; }
      .sidebar-bottom { margin-top: auto; }
      .main-content, .sidebar.collapsed ~ .main-content { width: 100%; margin-left: 0; }
      .blank-topbar {
        position: sticky; top: 0; z-index: 30;
        display: flex; min-height: 68px;
        padding: max(10px, env(safe-area-inset-top)) 16px 10px;
        background: var(--chi-color-surface, #fff);
        border-bottom: 1px solid var(--chi-color-border, #e5e7eb);
      }
      .mobile-brand { display: flex; min-height: 44px; }
      .blank-content {
        min-height: calc(100vh - 68px); min-height: calc(100dvh - 68px);
        padding: 0 16px max(76px, calc(env(safe-area-inset-bottom) + 72px));
      }
      .mobile-scrim {
        display: block; position: fixed; inset: 0; z-index: 60;
        background: rgb(10 14 24 / 48%); opacity: 0; visibility: hidden;
        transition: opacity 220ms ease, visibility 220ms ease;
        -webkit-tap-highlight-color: transparent;
      }
      .mobile-scrim.visible { opacity: 1; visibility: visible; }
      .theme-toggle {
        right: max(14px, env(safe-area-inset-right));
        bottom: max(14px, env(safe-area-inset-bottom));
        width: 46px; height: 46px; border-radius: 14px;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .main-content, .theme-toggle, .sidebar, .mobile-scrim { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="主要導覽">
      <a class="brand" href="#" aria-label="Chi 首頁">
        <span class="brand-mark">
          <img class="brand-icon brand-icon-light" src="https://nav.chi.qzz.io/assets/icon/icon-bw.png" alt="">
          <img class="brand-icon brand-icon-dark" src="https://nav.chi.qzz.io/assets/icon/icon-wb.png" alt="">
        </span>
        <span class="brand-copy"><strong>Chi</strong><small>PERSONAL SPACE</small></span>
      </a>
      <button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-label="收合側邊欄" title="收合側邊欄"><span aria-hidden="true">‹</span></button>
      <div class="sidebar-bottom">
        <span class="sidebar-status" aria-hidden="true"></span>
        <span>CHI</span>
        <span class="sidebar-version">v1.0</span>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar blank-topbar">
        <div class="mobile-brand">
          <button type="button" id="mobile-menu" aria-label="開啟導覽"><i class="fa-solid fa-bars" aria-hidden="true"></i></button>
          <span>Chi</span>
        </div>
      </header>
      <div id="main" class="content-wrap blank-content" aria-label="空白內容區"></div>
    </main>
  </div>
  <div class="mobile-scrim" id="mobile-scrim"></div>
  <button class="theme-toggle" id="theme-toggle" type="button" aria-label="外觀模式：跟隨系統，點擊切換" title="跟隨系統"><i class="fa-solid fa-circle-half-stroke" aria-hidden="true"></i></button>
  <script>
    (() => {
      const root = document.documentElement;
      const sidebar = document.getElementById('sidebar');
      const desktopToggle = document.getElementById('sidebar-toggle');
      const mobileToggle = document.getElementById('mobile-menu');
      const scrim = document.getElementById('mobile-scrim');
      const themeToggle = document.getElementById('theme-toggle');
      const modes = ['system', 'light', 'dark'];
      const icons = {
        system: 'fa-solid fa-circle-half-stroke',
        light: 'fa-solid fa-sun',
        dark: 'fa-solid fa-moon'
      };
      const labels = { system: '跟隨系統', light: '淺色模式', dark: '深色模式' };
      const media = window.matchMedia('(prefers-color-scheme: dark)');
      let mode = 'system';
      try {
        const saved = localStorage.getItem('chi-nav-theme');
        if (modes.includes(saved)) mode = saved;
      } catch {}

      function applyTheme() {
        const dark = mode === 'dark' || (mode === 'system' && media.matches);
        root.dataset.theme = dark ? 'dark' : 'light';
        root.dataset.themeMode = mode;
        themeToggle.innerHTML = '<i class="' + icons[mode] + '" aria-hidden="true"></i>';
        themeToggle.title = labels[mode];
        themeToggle.setAttribute('aria-label', '外觀模式：' + labels[mode] + '，點擊切換');
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', dark ? '#17191f' : '#f6f8fc');
      }
      themeToggle.addEventListener('click', () => {
        mode = modes[(modes.indexOf(mode) + 1) % modes.length];
        try { localStorage.setItem('chi-nav-theme', mode); } catch {}
        applyTheme();
      });
      media.addEventListener?.('change', () => { if (mode === 'system') applyTheme(); });
      applyTheme();

      desktopToggle.addEventListener('click', () => {
        const collapsed = sidebar.classList.toggle('collapsed');
        desktopToggle.setAttribute('aria-label', collapsed ? '展開側邊欄' : '收合側邊欄');
        desktopToggle.title = collapsed ? '展開側邊欄' : '收合側邊欄';
        desktopToggle.firstElementChild.textContent = collapsed ? '›' : '‹';
      });
      function closeMobileMenu() {
        sidebar.classList.remove('mobile-open');
        scrim.classList.remove('visible');
        mobileToggle?.setAttribute('aria-expanded', 'false');
      }
      mobileToggle?.addEventListener('click', () => {
        const open = sidebar.classList.toggle('mobile-open');
        scrim.classList.toggle('visible', open);
        mobileToggle.setAttribute('aria-expanded', String(open));
      });
      scrim.addEventListener('click', closeMobileMenu);
      document.addEventListener('keydown', event => {
        if (event.key === 'Escape') closeMobileMenu();
      });
      window.addEventListener('resize', () => {
        if (window.matchMedia('(min-width: 761px)').matches) closeMobileMenu();
      });
    })();
  </script>
</body>
</html>
